<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NCSA Training (prototype)</title>
  <meta name="description" content="Prototype front door for NCSA training: self-paced courses on Learn@NCSA, arranged by learning track.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to courses</a>
  <aside class="banner" aria-label="Prototype notice">Prototype. Course information comes from Learn@NCSA and may change.</aside>

  <header class="taskbar">
    <a class="brand" href="#/" aria-label="NCSA Training home">
      <span class="brand-mark" aria-hidden="true">N</span>
      <span class="brand-name">NCSA Training</span>
    </a>
    <form class="search" role="search" id="search-form">
      <label for="q" class="visually-hidden">Search courses and programs</label>
      <input id="q" type="search" placeholder="Search ( / )" autocomplete="off" spellcheck="false">
    </form>
    <div class="filters" role="group" aria-label="Filters">
      <button type="button" class="chip" data-filter="open" aria-pressed="false">Open to all</button>
      <button type="button" class="chip" data-filter="course" aria-pressed="false">Courses</button>
      <button type="button" class="chip" data-filter="program" aria-pressed="false">Programs</button>
    </div>
    <details class="tracks" id="tracks">
      <summary>Tracks</summary>
      <ul id="tracks-list" class="tracks-list"></ul>
    </details>
  </header>

  <main id="main" tabindex="-1">
    <h1 class="visually-hidden">NCSA Training: courses and programs by track</h1>
    <p id="status" class="status" role="status" aria-live="polite">Loading the catalog…</p>
    <div id="view"></div>
  </main>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-inner">
      <div class="sheet-head">
        <p id="sheet-type" class="badge"></p>
        <button type="button" id="sheet-close" class="icon-btn" aria-label="Close">×</button>
      </div>
      <div id="sheet-art" class="sheet-art" aria-hidden="true"></div>
      <h2 id="sheet-title" tabindex="-1"></h2>
      <p id="sheet-meta" class="meta"></p>
      <p id="sheet-summary" class="sheet-summary"></p>
      <div id="sheet-children" hidden>
        <h3 id="sheet-children-title">Inside this program</h3>
        <ul id="sheet-children-list" class="children"></ul>
      </div>
      <p id="sheet-tracks" class="meta"></p>
      <div class="sheet-actions">
        <a id="sheet-launch" class="primary" target="_blank" rel="noopener"></a>
        <button type="button" id="sheet-pin" class="secondary" aria-pressed="false">Pin to My desktop</button>
      </div>
    </div>
  </dialog>

  <footer class="footer">
    <p id="footer-meta"></p>
    <p><a href="curation.html">For curators</a> · <a href="api/v1/openapi.yaml">API contract</a></p>
  </footer>
  <script src="common.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
