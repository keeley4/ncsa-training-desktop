openapi: 3.1.0
info:
  title: NCSA Training Platform API
  version: 0.1.0
  summary: Public catalog (Phase 1) plus stubs for later phases.
  description: |
    Contract for the NCSA training front door and harness.

    * Phase 1 resources (`/catalog/meta`, `/categories`, `/shelves`, `/tiles`) are implemented two ways:
      as static JSON files published to GitHub Pages (`<base>/shelves.json`), and by the harness API
      (`<base>/shelves`). Both return identical bodies; the front door picks the suffix by configuration.
    * Resources marked `x-phase` > 1 are design stubs. They are not implemented yet and return 501 from the API.
    * Everything in Phase 1 is public data only: visible courses in visible categories, and fields that
      Moodle already shows to anonymous visitors. No user data.
  license:
    name: TBD
servers:
  - url: /api/v1
    description: Harness API (local Docker now, NCSA host from Phase 3)
  - url: ./api/v1
    description: Static snapshot on GitHub Pages (append `.json` to each path)
tags:
  - name: catalog
  - name: identity
  - name: learner
  - name: workshops
  - name: admin
  - name: later
paths:
  /catalog/meta:
    get:
      tags: [catalog]
      operationId: getCatalogMeta
      x-phase: 1
      summary: When and from where the catalog was built, plus content-health counts.
      responses:
        "200":
          description: Catalog metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogMeta" }
  /categories:
    get:
      tags: [catalog]
      operationId: listCategories
      x-phase: 1
      summary: Public Moodle categories.
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }
  /shelves:
    get:
      tags: [catalog]
      operationId: listShelves
      x-phase: 1
      summary: Shelves (learning tracks) in display order, each with ordered tile ids.
      responses:
        "200":
          description: Shelves
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Shelf" }
  /tiles:
    get:
      tags: [catalog]
      operationId: listTiles
      x-phase: 1
      summary: Every public tile, including tiles not yet placed on a shelf.
      responses:
        "200":
          description: Tiles
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Tile" }
  /tiles/{tileId}:
    get:
      tags: [catalog]
      operationId: getTile
      x-phase: 1
      parameters:
        - name: tileId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/TileId" }
      responses:
        "200":
          description: One tile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tile" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---- Later phases: design stubs, not implemented ----
  /me:
    get:
      tags: [identity]
      operationId: getMe
      x-phase: 3
      x-implemented: true
      summary: Who is signed in (Globus identity and linked identities). Never 401; signed-out returns signedIn=false.
      description: >
        Sign-in itself is a browser redirect flow outside the API: GET /auth/login?next=/path,
        GET /auth/callback (Globus returns here), POST /auth/logout. The session is an HttpOnly,
        Secure, SameSite=Lax cookie; this endpoint is not cacheable.
      responses:
        "200":
          description: Signed-in state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
  /me/progress:
    get:
      tags: [learner]
      operationId: getMyProgress
      x-phase: 3
      x-implemented: true
      summary: The signed-in learner's Learn@NCSA courses with progress and last access (My Desktop "Continue").
      description: >
        Read live from Learn@NCSA for the linked account only; not stored. status is the identity-crosswalk
        status; items is empty unless status is linked. Most recently accessed first.
      responses:
        "200":
          description: Courses.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressList" }
        "401": { description: Not signed in. }
  /paths:
    get:
      tags: [learner]
      operationId: getPath
      x-phase: 3
      x-implemented: true
      summary: Learning path for From Laptop to Cluster answers (work, scale, fit; optional ex, par).
      description: >
        Public. Answers must be ids from catalog/paths.yaml. Returns the stages in Laptop to Cluster order,
        the stage the learner is at (here), up to four "do these next" tile ids (focus), and upcoming
        scheduled workshops of the mapped offerings.
      responses:
        "200": { description: The path. }
        "400": { description: Unknown or missing answer. }
  /me/path:
    get:
      tags: [learner]
      operationId: getMyPath
      x-phase: 3
      x-implemented: true
      summary: The signed-in learner's saved path, if any.
      responses:
        "200": { description: "{saved: false} or {saved: true, answers, path}." }
        "401": { description: Not signed in. }
    put:
      tags: [learner]
      operationId: saveMyPath
      x-phase: 3
      x-implemented: true
      summary: Save the answers (same-site). Stores the five answer ids only.
      responses:
        "200": { description: Saved; returns the path. }
        "400": { description: Unknown or missing answer. }
        "401": { description: Not signed in. }
    delete:
      tags: [learner]
      operationId: deleteMyPath
      x-phase: 3
      x-implemented: true
      summary: Forget the saved answers (same-site).
      responses:
        "200": { description: "{saved: false}." }
        "401": { description: Not signed in. }
  /enrollments:
    post:
      tags: [learner]
      operationId: createEnrollment
      x-phase: 3
      x-implemented: true
      summary: Enroll-on-launch. Enrolls the signed-in learner as a student, then the client opens url.
      description: >
        Same-site only. Allowed when the course is on the front door, the learner's account is linked, and
        Learn@NCSA reports open self-enrollment with no key (so this only removes clicks; it never opens a
        closed course). Rate-limited per person and site-wide. On any refusal the client opens url, where
        Learn@NCSA handles enrollment as before.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courseId]
              properties:
                courseId: { type: integer }
      responses:
        "200": { description: Already enrolled., content: { application/json: { schema: { $ref: "#/components/schemas/EnrollmentResult" } } } }
        "201": { description: Enrolled., content: { application/json: { schema: { $ref: "#/components/schemas/EnrollmentResult" } } } }
        "401": { description: Not signed in. }
        "403": { description: Cross-site request. }
        "404": { description: Course is not on the front door. }
        "409": { description: "Not allowed (enrol_off, not_linked, not_open); open url instead." }
        "429": { description: Rate limited; open url instead. }
        "502": { description: Learn@NCSA unavailable or refused; open url instead. }
  /crosswalk/review:
    get:
      tags: [identity]
      operationId: listCrosswalkReview
      x-phase: 3
      x-implemented: true
      summary: People whose Learn@NCSA account could not be linked automatically (administrators only).
      responses:
        "200":
          description: Review queue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewList" }
        "401": { description: Not signed in. }
        "403": { description: Not an administrator. }
  /crosswalk/review/{userId}:
    post:
      tags: [identity]
      operationId: decideCrosswalkReview
      x-phase: 3
      x-implemented: true
      summary: Link the person to one of the candidate accounts, or reject all (administrators only, same-site only).
      parameters:
        - { name: userId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { enum: [link, reject] }
                moodleId: { type: integer }
      responses:
        "200": { description: Decision recorded. }
        "409": { description: Not a candidate, or no longer waiting for review. }
  /offerings:
    get:
      tags: [later]
      operationId: listOfferings
      x-phase: 4
      summary: Live workshop offerings (templates).
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
  /events:
    get:
      tags: [workshops]
      operationId: listEvents
      x-phase: 4
      x-implemented: true
      summary: Live workshops. Drafts are never listed; cancelled workshops are, with status cancelled.
      description: >
        Registration links out to each workshop's own form (registerUrl); this API stores no registrants.
        Times are ISO 8601 with the workshop's UTC offset. Upcoming = last session has not ended.
      parameters:
        - { name: when, in: query, schema: { enum: [upcoming, past, all], default: upcoming } }
      responses:
        "200":
          description: Workshops, soonest first (most recent first for past).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkshopList" }
  /events.ics:
    get:
      tags: [workshops]
      operationId: getEventsFeed
      x-phase: 4
      x-implemented: true
      summary: iCalendar feed of upcoming workshops (and those changed or cancelled in the last 30 days).
      responses:
        "200": { description: text/calendar, one VEVENT per session, UTC times, SEQUENCE bumped on every edit. }
  /events/{eventId}:
    get:
      tags: [workshops]
      operationId: getEvent
      x-phase: 4
      x-implemented: true
      summary: One workshop.
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The workshop.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workshop" }
        "404": { description: Not found (or still a draft). }
  /events/{eventId}.ics:
    get:
      tags: [workshops]
      operationId: getEventCalendar
      x-phase: 4
      x-implemented: true
      summary: Calendar file for one workshop.
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: text/calendar attachment. }
        "404": { description: Not found (or still a draft). }
  /admin/analytics:
    get:
      tags: [admin]
      operationId: getUsageAnalytics
      x-phase: 5
      x-implemented: true
      summary: Aggregate usage report (administrators only). No user ids or IP addresses are collected.
      parameters:
        - { name: days, in: query, schema: { enum: ["7", "30", "90", "365"], default: "30" } }
      responses:
        "200": { description: Totals, visits per day, searches, course opens/launches, accounts, enrollment, workshops. }
        "401": { description: Not signed in. }
        "403": { description: Not an administrator. }
  /registrations:
    post:
      tags: [later]
      operationId: createRegistration
      x-phase: 4
      summary: Register the signed-in user for a live session.
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
  /statements:
    post:
      tags: [later]
      operationId: createStatement
      x-phase: 5
      summary: Record an xAPI-shaped learning statement.
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }

components:
  responses:
    NotImplemented:
      description: Planned for a later phase.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Me:
      type: object
      additionalProperties: false
      required: [signedIn]
      properties:
        signedIn: { type: boolean }
        user: { $ref: "#/components/schemas/SignedInUser" }
      if: { properties: { signedIn: { const: true } } }
      then: { required: [signedIn, user] }
      else: { not: { required: [user] } }
    SignedInUser:
      type: object
      additionalProperties: false
      required: [globusId, name, identities]
      properties:
        globusId: { type: string, description: "Globus account id (primary identity sub)." }
        name: { type: string }
        email: { type: [string, "null"] }
        username: { type: [string, "null"], description: "preferred_username, e.g. netid@illinois.edu" }
        organization: { type: [string, "null"] }
        identityProvider: { type: [string, "null"], description: "Identity provider used for this sign-in." }
        lastLoginAt: { type: [string, "null"], format: date-time }
        moodle: { $ref: "#/components/schemas/MoodleLink" }
        identities:
          type: array
          description: Every identity linked to the Globus account; the identity-crosswalk match keys.
          items: { $ref: "#/components/schemas/LinkedIdentity" }
    MoodleLink:
      type: object
      additionalProperties: false
      required: [status, accountId]
      description: >
        The person's Learn@NCSA account, found at sign-in. linked = matched automatically by a Globus
        identity username; review = possible match awaiting an administrator; none = no account yet;
        unavailable = could not be checked. Other candidate accounts are never shown.
      properties:
        status: { enum: [linked, review, none, unavailable] }
        accountId: { type: [integer, "null"] }
    Workshop:
      type: object
      additionalProperties: false
      required: [id, title, summary, programTags, speakers, format, timezone, sessions, status, registerUrl]
      properties:
        id: { type: integer }
        offering: { type: string }
        title: { type: string }
        summary: { type: string }
        programTags: { type: array, items: { type: string } }
        speakers: { type: string }
        format: { enum: [webinar, series, hands-on] }
        timezone: { type: string, examples: [America/Chicago] }
        sessions:
          type: array
          minItems: 1
          items:
            type: object
            required: [start, end]
            properties:
              start: { type: string, format: date-time }
              end: { type: string, format: date-time }
        status: { enum: [scheduled, cancelled] }
        registerUrl: { type: [string, "null"] }
        calendarUrl: { type: [string, "null"] }
        moodleUrl: { type: [string, "null"] }
        recordingUrl: { type: [string, "null"] }
        updatedAt: { type: [string, "null"] }
    WorkshopList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Workshop" } }
    ProgressList:
      type: object
      additionalProperties: false
      required: [status, items]
      properties:
        status: { enum: [linked, review, none, unavailable] }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [courseId, title, url, tileId, progress, completed, lastAccess]
            properties:
              courseId: { type: integer }
              title: { type: string }
              url: { type: string }
              tileId: { type: [string, "null"], description: Front-door tile for this course, if it is on a shelf. }
              progress: { type: [integer, "null"], minimum: 0, maximum: 100, description: Percent of completion-tracked activities done; null if the course has no completion tracking. }
              completed: { type: [boolean, "null"] }
              lastAccess: { type: [string, "null"], format: date-time }
    EnrollmentResult:
      type: object
      required: [enrolled, url]
      properties:
        enrolled: { type: boolean }
        already: { type: boolean }
        url: { type: string }
        error: { type: string }
        message: { type: string }
    ReviewList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [userId, name, reason, candidates]
            properties:
              userId: { type: integer }
              name: { type: string }
              username: { type: [string, "null"] }
              email: { type: [string, "null"] }
              reason: { type: [string, "null"] }
              checkedAt: { type: [string, "null"] }
              candidates:
                type: array
                items:
                  type: object
                  required: [moodleId, auth, suspended, matchedBy]
                  properties:
                    moodleId: { type: integer }
                    auth: { type: string }
                    suspended: { type: boolean }
                    matchedBy: { enum: [username, email] }
    LinkedIdentity:
      type: object
      additionalProperties: false
      required: [sub, username]
      properties:
        sub: { type: string }
        username: { type: string }
        email: { type: [string, "null"] }
        identityProvider: { type: [string, "null"] }
        organization: { type: [string, "null"] }
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
        phase: { type: integer }
    TileId:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{1,79}$"
      examples: ["course-34", "group-ihpcss", "tool-delta-docs"]
    ShelfId:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{1,79}$"
    Category:
      type: object
      additionalProperties: false
      required: [id, name, parentId, courseCount]
      properties:
        id: { type: integer }
        name: { type: string }
        parentId: { type: ["integer", "null"] }
        courseCount:
          type: integer
          description: Public courses directly in this category.
    Shelf:
      type: object
      additionalProperties: false
      required: [id, title, purpose, tileIds, startHere]
      properties:
        id: { $ref: "#/components/schemas/ShelfId" }
        title: { type: string }
        purpose: { type: string, description: One-line purpose shown under the shelf title. }
        tileIds:
          type: array
          items: { $ref: "#/components/schemas/TileId" }
        startHere:
          type: ["string", "null"]
          description: Tile id to suggest first on this shelf.
    TileType:
      type: string
      enum: [course, program, live, recording, tool]
    Level:
      type: ["string", "null"]
      enum: [intro, intermediate, advanced, null]
    Tile:
      type: object
      additionalProperties: false
      required: [id, type, title, summary, launch, guestAccess, image, category, level, minutes, shelfIds, source, health]
      properties:
        id: { $ref: "#/components/schemas/TileId" }
        type: { $ref: "#/components/schemas/TileType" }
        title: { type: string }
        summary:
          type: string
          description: Plain text, no HTML. Empty string when the source has none.
        launch:
          type: object
          additionalProperties: false
          required: [label, url]
          properties:
            label: { type: string, examples: ["Open course"] }
            url: { type: string, format: uri }
        guestAccess:
          type: boolean
          description: True when anyone can open the course without enrolling.
        image:
          type: ["string", "null"]
          format: uri
        category:
          oneOf:
            - $ref: "#/components/schemas/CategoryRef"
            - type: "null"
        level: { $ref: "#/components/schemas/Level" }
        minutes:
          type: ["integer", "null"]
          description: Curated time estimate.
        shelfIds:
          type: array
          items: { $ref: "#/components/schemas/ShelfId" }
        children:
          type: array
          description: For programs and series, the courses inside, newest first.
          items: { $ref: "#/components/schemas/TileChild" }
        source: { $ref: "#/components/schemas/Source" }
        health:
          type: array
          description: Content-health flags for curators.
          items:
            type: string
            enum: [no-summary, no-image, unshelved]
    CategoryRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    TileChild:
      type: object
      additionalProperties: false
      required: [title, url, guestAccess]
      properties:
        title: { type: string }
        url: { type: string, format: uri }
        guestAccess: { type: boolean }
    Source:
      type: object
      additionalProperties: false
      required: [system, ids]
      properties:
        system: { type: string, enum: [moodle, curated] }
        ids:
          type: array
          items: { type: integer }
          description: Moodle course ids behind this tile.
    CatalogMeta:
      type: object
      additionalProperties: false
      required: [schemaVersion, generatedAt, source, counts, health, warnings]
      properties:
        schemaVersion: { type: string, const: "1" }
        generatedAt: { type: string, format: date-time }
        source:
          type: object
          additionalProperties: false
          required: [mode, siteUrl, siteName, release]
          properties:
            mode: { type: string, enum: [live, fixture] }
            siteUrl: { type: string, format: uri }
            siteName: { type: string }
            release: { type: string }
        counts:
          type: object
          additionalProperties: false
          required: [courses, tiles, shelves, categories]
          properties:
            courses: { type: integer, description: Public Moodle courses. }
            tiles: { type: integer }
            shelves: { type: integer }
            categories: { type: integer }
        health:
          type: object
          additionalProperties: false
          required: [noSummary, noImage, unshelved]
          properties:
            noSummary: { type: array, items: { $ref: "#/components/schemas/TileId" } }
            noImage: { type: array, items: { $ref: "#/components/schemas/TileId" } }
            unshelved: { type: array, items: { $ref: "#/components/schemas/TileId" } }
        warnings:
          type: array
          items: { type: string }
          description: Curation problems found during the build (e.g. a shelf names a course that is not public).
