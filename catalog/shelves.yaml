# Shelves (learning tracks) for the NCSA training front door.
#
# Edit this file to curate the desktop. It is the only hand-maintained catalog input;
# everything else comes from Moodle. Changes go through a pull request.
#
#   shelves:  display order matters. `tiles` lists tile refs in display order.
#   tile refs:  course:<moodle course id>   or   group:<group key>   or   tool:<tool key>
#   groups:   several Moodle courses shown as ONE tile (a program with yearly runs, a multi-session series).
#   tools:    external links (docs, Open OnDemand, ...). Add only URLs you have checked.
#   overrides: optional per-tile level (intro | intermediate | advanced) and minutes.
#
# The build warns (and the curation report lists) any public course that is on no shelf,
# and any ref that points at a course that is not public.
# Course ids below come from learn.ncsa.illinois.edu as of 2026-11-04.

shelves:
  - id: get-started
    title: Get started on NCSA systems
    purpose: First steps on the Illinois Campus Cluster, Delta, DeltaAI and ICRN.
    startHere: course:39
    tiles:
      - course:39    # Getting Started on the Illinois Campus Cluster
      - course:109   # Webinar: Getting Started on the IL Campus Cluster
      - course:94    # Getting Started on NCSA Delta
      - course:98    # Delta: Basics of Access and Usage
      - course:115   # Webinar: Getting Started on DeltaAI
      - course:114   # Interactive Jupyter Notebooks using ICRN
      - course:97    # Interactive Jobs and Partitions

  - id: hpc-foundations
    title: HPC foundations
    purpose: The command line, clusters, environments and file systems.
    startHere: [course:122, course:112]   # 122 once it is published in Learn@NCSA, else 112
    tiles:
      - course:122   # The Unix Shell (Software Carpentry); hidden until reviewed, so left out until then
      - course:112   # How to Use the Linux Command Line Interface (CLI)
      - course:71    # Using an HPC Cluster for Scientific Applications
      - course:77    # Customizing Your Computing Environment
      - course:32    # Using the Lustre File System

  - id: parallel-programming
    title: Parallel programming
    purpose: From first MPI program to hybrid codes and debugging.
    startHere: course:40
    tiles:
      - course:40    # Parallel Computing on High-Performance Systems
      - course:72    # Getting Started with MPI
      - course:34    # Introduction to MPI
      - course:43    # Introduction to OpenMP
      - course:49    # Multilevel Parallel Programming
      - course:33    # Debugging Serial and Parallel Codes

  - id: performance-gpus-io
    title: Performance, GPUs and I/O
    purpose: Measure, tune, and move to GPUs and fast I/O.
    startHere: course:44
    tiles:
      - course:44    # Introduction to Performance Tools
      - course:76    # Profiling Python Applications
      - course:99    # No More Porting! Programming GPUs with C++, Fortran, and Python
      - course:96    # NVIDIA GH200 Grace Hopper Superchip on DeltaAI
      - course:92    # Efficient I/O: HDF5 and DLIO

  - id: ai-data-science
    title: AI and data science
    purpose: Machine learning and data work on NCSA resources.
    startHere: course:82
    tiles:
      - course:82    # AI for Science using Delta
      - course:116   # Geospatial Deep Learning w/ TorchGeo
      - course:114   # Interactive Jupyter Notebooks using ICRN

  - id: visualization-quantum
    title: Visualization and quantum
    purpose: See your data, and try analog quantum computing.
    startHere: course:46
    tiles:
      - course:46    # Introduction to Visualization
      - group:bloqade

  - id: programs-cohorts
    title: Programs and cohorts
    purpose: Multi-week programs; past years are inside each tile.
    startHere: null
    tiles:
      - group:ihpcss
      - group:ci-pathways

  - id: professional-skills
    title: Research and professional skills
    purpose: Accessibility, teaching, security, and webinar archives.
    startHere: null
    tiles:
      - course:113   # Accessible HPC Workshop Series
      - course:17    # Developing Effective Training Webinars
      - course:27    # Cybersecurity for End Users
      - course:68    # Delta Training Webinars Video Archive

groups:
  ihpcss:
    type: program
    title: International HPC Summer School
    summary: The annual International HPC Summer School. Open the newest year, or browse past years.
    primary: 106     # the course the tile opens; others are listed inside, newest first
    courses: [106, 93, 79, 75, 36, 26, 23, 16]
  ci-pathways:
    type: program
    title: CI Pathways
    summary: CI Pathways cohort program materials.
    primary: 108
    courses: [108, 101]
  bloqade:
    type: course
    title: Analog Quantum Computing with Bloqade
    summary: A two-session introduction to analog quantum computing with Bloqade.
    primary: 83
    courses: [83, 84]

tools: {}
  # Example (add only verified URLs):
  # delta-docs:
  #   title: Delta user documentation
  #   summary: Official Delta user guide.
  #   url: https://example.org/

# Levels below are Claude's draft from each course's own description (2026-11-10); Chris to confirm.
# minutes only where Learn@NCSA states a length (recording length, session times). Unknown = left out, so the
# tile shows the level alone. Fill the rest from the course owners.
# summary: only for courses whose Moodle summary is empty; written from the course page contents.
overrides:
  course:122:
    level: intro
    minutes: 95   # Part 1 (setup + episodes 1-3) per the lesson's own schedule; the whole lesson is 4 h 30 min
  course:112:
    level: intro
    summary: >-
      A short reading list for the Linux command line: a recommended video playlist and two text lessons
      on the most common commands. Start here if you have never used a terminal.
  course:71:  { level: intro }
  course:77:  { level: intro }
  course:114:
    level: intro
    summary: >-
      Recording of a February 2026 webinar. What Jupyter notebooks are, how to run them on ICRN (Illinois
      Computes Research Notebooks) with nothing to install, and a first look at NumPy, SciPy, Pandas and
      Matplotlib. Includes slides and two example notebooks to download.
  course:39:  { level: intro }
  course:109: { level: intro }
  course:94:  { level: intro }
  course:98:  { level: intro, minutes: 90 }
  course:115: { level: intro }
  course:97:  { level: intro }
  course:40:  { level: intro }
  course:72:  { level: intro }
  course:34:  { level: intro }
  course:43:  { level: intro }
  course:32:  { level: intermediate }
  course:44:  { level: intermediate }
  course:76:  { level: intermediate }
  course:99:  { level: intermediate }
  course:96:  { level: intermediate, minutes: 60 }
  course:92:  { level: intermediate }
  course:116: { level: intermediate }
  course:33:  { level: intermediate }
  course:49:  { level: advanced }
  course:82:  { minutes: 600 }          # ten 1-hour sessions; covers basic to advanced, so no single level
  course:46:  { level: intro }
  course:113: { level: intro, minutes: 270 }   # three 90-minute sessions
  course:17:  { level: intro }
  course:27:  { level: intro }
  course:68:
    summary: >-
      A YouTube playlist of recorded Delta training webinars. Pick any recording;
      there is no order to follow.
