# Learning paths for "From Laptop to Cluster" (keeley4/intro_hpc) → front door.
#
# Laptop to Cluster's last step sends   #/path?work=&scale=&fit=&ex=&par=   to the front door.
# This file turns those answers into a staged path of Learn@NCSA courses and live workshops.
# Edit freely; refs use the same form as shelves.yaml (course:<id>, group:<key>). A course that is not
# on the published front door is skipped. Offerings are coordinator offering slugs (/coord/offerings):
# upcoming scheduled workshops of that offering are shown.
#
# DRAFT 2026-11-10: mapping drafted from course titles and descriptions; Chris to review.

l2c_url: https://keeley4.github.io/intro_hpc/

# The journey, in Laptop to Cluster order. l2c_steps are its step numbers (1–9).
#   steps:  the ordered sequence for the stage. The first one is shown as "Start with this".
#   also:   useful, but not on the main line (a webinar version of a step, a short extra). Shown collapsed.
#   ready:  one line: how you know you are ready for the next stage.
#   label:  the stage number people see (defaults to its position). 4a and 4b are two ways to scale up;
#           neither needs the other.
# Revised 2026-11-10 after the UX review: stages ordered, mappings fixed, stage 4 split. Chris to confirm.
stages:
  - id: start
    label: "1"
    title: "Basics: the command line and what a cluster is"
    summary: Before you need a cluster. No cluster account needed.
    l2c_steps: [1, 2]
    # Course 122 (The Unix Shell, Software Carpentry lesson in Learn@NCSA) replaces 112 as the first step.
    # It is hidden until Chris reviews it; until then 112 stays the first step. Once 122 is visible,
    # 112 moves under "Also useful" with no further edit.
    steps: [[course:122, course:112], course:71]
    also: []
    ready: You can open a terminal, move between folders and edit a file.
    offerings: []
  - id: icrn
    label: "2"
    title: "Notebooks at NCSA (ICRN)"
    summary: Jupyter, RStudio or VS Code in your browser, with nothing to install.
    l2c_steps: [3]
    steps: [course:114]
    also: []
    ready: Your notebook runs out of time or memory, or you need many runs at once.
    offerings: [jupyter-icrn, deep-learning-icrn]
  - id: cluster
    label: "3"
    title: "Batch jobs on the Campus Cluster"
    summary: An account, files, software modules and Slurm job scripts.
    l2c_steps: [4, 6, 7]
    steps: [course:39, course:77, course:32]
    also: [course:109]
    ready: You can log in, load a module and submit a batch job that finishes.
    offerings: [getting-started-icc, gpus-on-icc, container-basics]
  - id: parallel
    label: "4a"
    title: "Parallel code: OpenMP and MPI"
    summary: Make one program use many cores, then many nodes.
    l2c_steps: [5]
    steps: [course:40, course:72, course:43, course:49]
    also: [course:34, course:33]
    ready: ""
    offerings: [intro-parallel-computing, psc-mpi, psc-openmp]
  - id: systems
    label: "4b"
    title: "Bigger systems: Delta, DeltaAI and GPUs"
    summary: National systems, GPU programming and measuring performance.
    l2c_steps: [8]
    steps: [course:94, course:99, course:44]
    also: [course:98, course:115, course:96, course:97, course:76, course:92]
    ready: ""
    offerings: [getting-started-delta, getting-started-deltaai, psc-openacc, nvidia-gpus-python]

# Allowed answers (ids must match Laptop to Cluster; names are what people see).
answers:
  work:
    - { id: explore, name: Explore and analyze data }
    - { id: mem, name: Data too big for memory }
    - { id: sweep, name: Many independent runs }
    - { id: sim, name: One large simulation }
    - { id: gpusim, name: GPU-accelerated simulation }
    - { id: train, name: Train or fine-tune AI models }
    - { id: web, name: Host a website }
    - { id: app, name: Share an interactive app }
  scale:
    - { id: S, name: Small }
    - { id: M, name: Medium }
    - { id: L, name: Large }
  fit:
    - { id: lap, name: Your laptop }
    - { id: icrn, name: ICRN }
    - { id: iccp, name: Illinois Campus Cluster }
    - { id: delta, name: Delta }
    - { id: dai, name: DeltaAI }
    - { id: rad, name: Radiant }
    - { id: cpanel, name: Campus web hosting (cPanel) }
  ex:
    - { id: climate, name: Weather and climate }
    - { id: md, name: Molecules and materials }
    - { id: genomics, name: Genomics and bioinformatics }
    - { id: ml, name: Machine learning and AI }
    - { id: social, name: Social and health sciences }
  par:
    - { id: "yes", name: Code uses many cores }
    - { id: notsure, name: Not sure the code uses many cores }
    - { id: "no", name: Code uses one core }

# Where the learner is, from Laptop to Cluster's best-fit resource. null = no course path (web hosting).
fit_stage: { lap: start, icrn: icrn, iccp: cluster, delta: systems, dai: systems, rad: null, cpanel: null }
# Large Campus Cluster work is already "parallel code".
scale_up:
  iccp: { scales: [L], stage: parallel }

# "Do these next": candidates from the best-fit resource, the kind of work and the parallel-code answer,
# then put in journey order (stage, then step) and cut to focus_max. One pick per topic: no webinar twins.
fit_tiles:
  lap: [course:112]
  icrn: [course:114]
  iccp: [course:39]
  delta: [course:94]
  dai: [course:115]
work_tiles:
  explore: [course:114]
  mem: [course:32, course:92]
  sweep: [course:97]
  sim: [course:72, course:43]
  gpusim: [course:99]
  train: [course:82, course:116]
par_tiles:
  "no": [course:40]
  notsure: [course:40]
fit_offerings:
  icrn: [jupyter-icrn]
  iccp: [getting-started-icc, gpus-on-icc]
  delta: [getting-started-delta]
  dai: [getting-started-deltaai]
work_offerings:
  train: [nvidia-gpus-python, deep-learning-icrn]
  gpusim: [nvidia-gpus-python]
  sim: [intro-parallel-computing, psc-mpi]
  sweep: [intro-parallel-computing]

focus_max: 3
no_path_note: Websites and shared apps are not covered by courses yet. Contact NCSA System Support for help getting started.
