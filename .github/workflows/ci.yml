name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # Pinned: ubuntu-latest is moving to Ubuntu 26, where the Chromium install step hung for 10 minutes (11-11).
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Install Chromium for browser and accessibility tests
        run: python -m playwright install --with-deps chromium
      - name: Tests (unit, Postgres store, browser + axe accessibility)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
      - name: Fixture build (shows the build report)
        run: python -m harness build --mode fixture --shelves fixtures/shelves.yaml --out /tmp/site
